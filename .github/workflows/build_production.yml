# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Build Production

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'release'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use latest Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
      - run: npm ci
      - run: npm test
      - run: npm run build --if-present

      - name: Update BUILD_NUMBER in env file
        run: |
          if grep -q '^BUILD_NUMBER=' src/config/.env; then
            sed -i "s/^BUILD_NUMBER=.*/BUILD_NUMBER=${{ github.run_number }}/" src/config/.env
          else
            echo "BUILD_NUMBER=${{ github.run_number }}" >> src/config/.env
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Set package namespace
        run: echo "PKG_NS=$(echo '${{ secrets.GHCR_NAMESPACE || github.actor }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.PKG_NS }}/api_phoenix:release
            ghcr.io/${{ env.PKG_NS }}/api_phoenix:release-build-${{ github.run_number }}
          build-args: |
            BUILD_NUMBER=${{ github.run_number }}

      - name: ntfy-success-notifications
        uses: niniyas/ntfy-action@master
        if: success()
        with:
          url: "https://ntfy.monnyka.top"
          topic: "server"
          priority: 4
          headers: ${{ secrets.NTFY_HEADERS_JSON }}
          tags: +1,partying_face,action,successfully,completed
          details: Workflow has been successfully completed!
